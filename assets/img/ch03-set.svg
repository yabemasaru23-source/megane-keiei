<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 470" role="img" aria-label="任せるときは2つをセットで渡す。左は任された範囲（店の月の売上目標を達成し、廃棄を売上の5%以内に。しめきりは毎月最終日）。右は使える道具（棚のならべ方・値引き3割引きまで、人件費28%以内のシフト、1回3万円までの備品）。渡したあとは、道具の中は自分で決めてあとで報告、道具をこえるときは決める前に相談、上司は途中で口を出さない。そして、しめきりの日に、できあがりで確かめる">
<rect width="800" height="470" rx="18" fill="var(--sky, #dbe7fb)"/>
<text x="400" y="42" text-anchor="middle" font-size="19" fill="var(--ink, #1d2540)" font-family="Zen Maru Gothic, sans-serif" font-weight="700">任せるときは、2つをセットで渡す</text>
<g stroke-linecap="round" stroke-linejoin="round">
<rect x="32" y="64" width="336" height="136" rx="14" fill="var(--sun-soft, #fdf0cc)" stroke="var(--sun, #f2b01e)" stroke-width="3"/><text x="200.0" y="96" text-anchor="middle" font-size="17" fill="var(--warm, #c0583a)" font-family="Zen Maru Gothic, sans-serif" font-weight="700">🎯 任された範囲</text><text x="200.0" y="126" text-anchor="middle" font-size="14" fill="var(--ink, #1d2540)" font-family="Zen Maru Gothic, sans-serif" font-weight="700">店の月の売上目標を達成し、</text><text x="200.0" y="150" text-anchor="middle" font-size="14" fill="var(--ink, #1d2540)" font-family="Zen Maru Gothic, sans-serif" font-weight="700">廃棄を売上の5%以内におさえる</text><text x="200.0" y="174" text-anchor="middle" font-size="14" fill="var(--ink, #1d2540)" font-family="Zen Maru Gothic, sans-serif" font-weight="700">しめきり：毎月最終日</text>
<circle cx="400" cy="139" r="20" fill="var(--surface, #fff)" stroke="var(--ink, #1d2540)" stroke-width="2.5"/>
<path d="M390 139 h20 M400 129 v20" stroke="var(--ink, #1d2540)" stroke-width="3.5"/>
<rect x="432" y="64" width="336" height="136" rx="14" fill="var(--leaf-soft, #dcf1e8)" stroke="var(--leaf, #2f8f6b)" stroke-width="3"/><text x="600.0" y="96" text-anchor="middle" font-size="17" fill="var(--leaf, #2f8f6b)" font-family="Zen Maru Gothic, sans-serif" font-weight="700">🧰 使える道具</text><text x="600.0" y="126" text-anchor="middle" font-size="14" fill="var(--ink, #1d2540)" font-family="Zen Maru Gothic, sans-serif" font-weight="700">棚のならべ方・値引き3割引きまで</text><text x="600.0" y="150" text-anchor="middle" font-size="14" fill="var(--ink, #1d2540)" font-family="Zen Maru Gothic, sans-serif" font-weight="700">人件費28%以内のシフト</text><text x="600.0" y="174" text-anchor="middle" font-size="14" fill="var(--ink, #1d2540)" font-family="Zen Maru Gothic, sans-serif" font-weight="700">1回3万円までの備品</text>
<path d="M200 208 v18 h400 v-18" fill="none" stroke="var(--ink-soft, #545c78)" stroke-width="2.5"/>
<path d="M400 226 v28" stroke="var(--ink-soft, #545c78)" stroke-width="3"/><path d="M390 248 l10 10 l10 -10" fill="none" stroke="var(--ink-soft, #545c78)" stroke-width="3"/>
<rect x="32" y="268" width="232" height="104" rx="12" fill="var(--surface, #fff)" stroke="var(--ink, #1d2540)" stroke-width="2.5"/><circle cx="54" cy="294" r="8" fill="var(--leaf, #2f8f6b)"/><text x="70" y="300" font-size="15" fill="var(--ink, #1d2540)" font-family="Zen Maru Gothic, sans-serif" font-weight="700">道具の中</text><text x="148.0" y="330" text-anchor="middle" font-size="14" fill="var(--ink-soft, #545c78)" font-family="Zen Maru Gothic, sans-serif" font-weight="700">自分で決める</text><text x="148.0" y="352" text-anchor="middle" font-size="14" fill="var(--ink-soft, #545c78)" font-family="Zen Maru Gothic, sans-serif" font-weight="700">あとで結果を報告</text>
<rect x="284" y="268" width="232" height="104" rx="12" fill="var(--surface, #fff)" stroke="var(--ink, #1d2540)" stroke-width="2.5"/><circle cx="306" cy="294" r="8" fill="var(--sun, #f2b01e)"/><text x="322" y="300" font-size="15" fill="var(--ink, #1d2540)" font-family="Zen Maru Gothic, sans-serif" font-weight="700">道具をこえるとき</text><text x="400.0" y="330" text-anchor="middle" font-size="14" fill="var(--ink-soft, #545c78)" font-family="Zen Maru Gothic, sans-serif" font-weight="700">決める前に相談</text><text x="400.0" y="352" text-anchor="middle" font-size="14" fill="var(--ink-soft, #545c78)" font-family="Zen Maru Gothic, sans-serif" font-weight="700">（あとからはダメ）</text>
<rect x="536" y="268" width="232" height="104" rx="12" fill="var(--surface, #fff)" stroke="var(--ink, #1d2540)" stroke-width="2.5"/><circle cx="558" cy="294" r="8" fill="var(--sky-ink, #6f86b8)"/><text x="574" y="300" font-size="15" fill="var(--ink, #1d2540)" font-family="Zen Maru Gothic, sans-serif" font-weight="700">上司は</text><text x="652.0" y="330" text-anchor="middle" font-size="14" fill="var(--ink-soft, #545c78)" font-family="Zen Maru Gothic, sans-serif" font-weight="700">途中で口を出さない</text><text x="652.0" y="352" text-anchor="middle" font-size="14" fill="var(--ink-soft, #545c78)" font-family="Zen Maru Gothic, sans-serif" font-weight="700">決めたことを変えない</text>
<rect x="32" y="390" width="736" height="56" rx="14" fill="var(--sun, #f2b01e)" stroke="var(--ink, #1d2540)" stroke-width="2.5"/>
<text x="400" y="425" text-anchor="middle" font-size="18" fill="#1d2540" font-family="Zen Maru Gothic, sans-serif" font-weight="700">🏁 しめきりの日に、「できあがり」で確かめる</text>
</g></svg>