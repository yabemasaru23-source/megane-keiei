<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440" role="img" aria-label="自分の勝ちは、チームの勝ちを通って返ってくる。①チームの勝ち（会社の目標）から、②席のできあがり（成長シートの点数）へ、そして③自分の勝ち（給料・ほめられる・できることが増える・役職）へ矢印がつながる。自分の勝ちが見えると、もっと力が出て、また①にもどってくり返す。下には、パンの取り合いや手柄の取り合いのような「自分だけの勝ち」は、チームの勝ちを通らないので点数にならない、と✕がついている">
<rect width="800" height="440" rx="18" fill="var(--sky, #dbe7fb)"/>
<text x="400" y="48" text-anchor="middle" font-size="18" fill="var(--ink, #1d2540)" font-family="Zen Maru Gothic, sans-serif" font-weight="700">「自分の勝ち」は、チームの勝ちを通って返ってくる</text>
<g stroke-linecap="round" stroke-linejoin="round">
<rect x="24" y="78" width="220" height="168" rx="16" fill="var(--sun-soft, #fdf0cc)" stroke="var(--sun, #f2b01e)" stroke-width="3"/><text x="134.0" y="112" text-anchor="middle" font-size="17" fill="var(--ink, #1d2540)" font-family="Zen Maru Gothic, sans-serif" font-weight="700">① チームの勝ち</text><text x="134.0" y="144" text-anchor="middle" font-size="13" fill="var(--ink, #1d2540)" font-family="Zen Maru Gothic, sans-serif" font-weight="700">会社の目標</text><text x="134.0" y="168" text-anchor="middle" font-size="13" fill="var(--ink, #1d2540)" font-family="Zen Maru Gothic, sans-serif" font-weight="700">例：4店舗目を出す</text><text x="134.0" y="192" text-anchor="middle" font-size="13" fill="var(--ink, #1d2540)" font-family="Zen Maru Gothic, sans-serif" font-weight="700">店の売上目標の達成</text><path d="M250 162 H284" stroke="var(--ink-soft, #545c78)" stroke-width="3"/><path d="M275 153 L284 162 L275 171" fill="none" stroke="var(--ink-soft, #545c78)" stroke-width="3"/><rect x="290" y="78" width="220" height="168" rx="16" fill="var(--leaf-soft, #dcf1e8)" stroke="var(--leaf, #2f8f6b)" stroke-width="3"/><text x="400.0" y="112" text-anchor="middle" font-size="17" fill="var(--ink, #1d2540)" font-family="Zen Maru Gothic, sans-serif" font-weight="700">② 席のできあがり</text><text x="400.0" y="144" text-anchor="middle" font-size="13" fill="var(--ink, #1d2540)" font-family="Zen Maru Gothic, sans-serif" font-weight="700">成長シートの点数</text><text x="400.0" y="168" text-anchor="middle" font-size="13" fill="var(--ink, #1d2540)" font-family="Zen Maru Gothic, sans-serif" font-weight="700">例：朝7時30分に</text><text x="400.0" y="192" text-anchor="middle" font-size="13" fill="var(--ink, #1d2540)" font-family="Zen Maru Gothic, sans-serif" font-weight="700">24種類ならんだ</text><path d="M516 162 H550" stroke="var(--ink-soft, #545c78)" stroke-width="3"/><path d="M541 153 L550 162 L541 171" fill="none" stroke="var(--ink-soft, #545c78)" stroke-width="3"/><rect x="556" y="78" width="220" height="168" rx="16" fill="var(--surface, #fff)" stroke="var(--ink, #1d2540)" stroke-width="3"/><text x="666" y="112" text-anchor="middle" font-size="17" fill="var(--ink, #1d2540)" font-family="Zen Maru Gothic, sans-serif" font-weight="700">③ 自分の勝ち</text><text x="600" y="144" font-size="15">💴</text><text x="624" y="144" text-anchor="start" font-size="13" fill="var(--ink, #1d2540)" font-family="Zen Maru Gothic, sans-serif" font-weight="700">給料</text><text x="600" y="170" font-size="15">👏</text><text x="624" y="170" text-anchor="start" font-size="13" fill="var(--ink, #1d2540)" font-family="Zen Maru Gothic, sans-serif" font-weight="700">ほめられる</text><text x="600" y="196" font-size="15">🌱</text><text x="624" y="196" text-anchor="start" font-size="13" fill="var(--ink, #1d2540)" font-family="Zen Maru Gothic, sans-serif" font-weight="700">できることが増える</text><text x="600" y="222" font-size="15">🪑</text><text x="624" y="222" text-anchor="start" font-size="13" fill="var(--ink, #1d2540)" font-family="Zen Maru Gothic, sans-serif" font-weight="700">役職</text><path d="M666 248 V282 Q666 296 652 296 H148 Q134 296 134 282 V256" fill="none" stroke="var(--leaf, #2f8f6b)" stroke-width="3" stroke-dasharray="2 7"/><path d="M125 264 L134 251 L143 264" fill="none" stroke="var(--leaf, #2f8f6b)" stroke-width="3"/><rect x="250" y="282" width="300" height="28" rx="14" fill="var(--sky, #dbe7fb)"/><text x="400" y="302" text-anchor="middle" font-size="13" fill="var(--leaf, #2f8f6b)" font-family="Zen Maru Gothic, sans-serif" font-weight="700">見えると、もっと力が出る（くり返す）</text><rect x="24" y="336" width="360" height="80" rx="16" fill="var(--surface, #fff)" stroke="var(--warm, #c0583a)" stroke-width="3" stroke-dasharray="8 6"/><text x="204" y="368" text-anchor="middle" font-size="16" fill="var(--warm, #c0583a)" font-family="Zen Maru Gothic, sans-serif" font-weight="700">自分だけの勝ち</text><text x="204" y="396" text-anchor="middle" font-size="13" fill="var(--ink, #1d2540)" font-family="Zen Maru Gothic, sans-serif" font-weight="700">パンの取り合い・手柄の取り合い</text><path d="M392 376 H560" stroke="var(--warm, #c0583a)" stroke-width="3" stroke-dasharray="8 6"/><path d="M570 362 L598 390 M598 362 L570 390" stroke="var(--warm, #c0583a)" stroke-width="5"/><text x="612" y="370" text-anchor="start" font-size="15" fill="var(--warm, #c0583a)" font-family="Zen Maru Gothic, sans-serif" font-weight="700">点数にならない</text><text x="612" y="394" text-anchor="start" font-size="12" fill="var(--ink-soft, #545c78)" font-family="Zen Maru Gothic, sans-serif" font-weight="700">（チームの勝ちを通らない）</text>
</g>
</svg>