<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440" role="img" aria-label="成長の木。いちばん下の土が毎日の約束、その上の根が知っておくこと・できること、幹と枝が大事な仕事、いちばん上の実がチームに届けるできあがり。木は下から順に育つ">
