<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 320" role="img" aria-label="リレーで、走ってきた子が次の子にバトンをわたしている。左の記録板には、1走と2走の区間の記録と「チームの記録が勝ち」と書いてある。フクロウのミルルが「バトンがつながると、みんなが勝つ」と話している">
