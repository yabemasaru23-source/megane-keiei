<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440" role="img" aria-label="くもった頼み方とゴールテープつきの頼み方のくらべっこ。左は「明日の開店準備、しっかり頼むね！」とだけ言っていて、何を・いつまでに・どうなっていたら合格かがわからず、できあがりがバラバラになる。右はできあがりの姿（焼きたてパン24種類が値札つきで棚にならんでいる）、しめきり（毎日朝7時30分）、確かめるもの（棚の写真と開店準備チェック表）の3点セットがそろい、やり方は任せている">
<rect width="800" height="440" rx="18" fill="var(--sky, #dbe7fb)"/>
<text x="400" y="42" text-anchor="middle" font-size="18" fill="var(--ink, #1d2540)" font-family="Zen Maru Gothic, sans-serif" font-weight="700">同じ仕事でも、頼み方でできあがりが変わる</text>
<g stroke-linecap="round" stroke-linejoin="round">
<rect x="24" y="66" width="340" height="350" rx="14" fill="var(--surface, #fff)" stroke="var(--ink, #1d2540)" stroke-width="2.5"/>
<text x="194" y="97" text-anchor="middle" font-size="17" fill="var(--ink, #1d2540)" font-family="Zen Maru Gothic, sans-serif" font-weight="700">☁️ くもった頼み方</text>
<rect x="48" y="114" width="292" height="72" rx="14" fill="var(--surface, #fff)" stroke="var(--ink-soft, #545c78)" stroke-width="2"/>
<text x="194" y="144" text-anchor="middle" font-size="16" fill="var(--ink, #1d2540)" font-family="Zen Maru Gothic, sans-serif" font-weight="700">「明日の開店準備、</text>
<text x="194" y="168" text-anchor="middle" font-size="16" fill="var(--ink, #1d2540)" font-family="Zen Maru Gothic, sans-serif" font-weight="700">しっかり頼むね！」</text>
<rect x="56" y="206" width="276" height="36" rx="18" fill="#e9ecf2"/><text x="76" y="230" font-size="15" fill="#545c78" font-family="Zen Maru Gothic, sans-serif" font-weight="700">❓ 何を？</text><rect x="56" y="252" width="276" height="36" rx="18" fill="#e9ecf2"/><text x="76" y="276" font-size="15" fill="#545c78" font-family="Zen Maru Gothic, sans-serif" font-weight="700">❓ いつまでに？</text><rect x="56" y="298" width="276" height="36" rx="18" fill="#e9ecf2"/><text x="76" y="322" font-size="15" fill="#545c78" font-family="Zen Maru Gothic, sans-serif" font-weight="700">❓ どうなっていたら合格？</text>
<text x="194" y="374" text-anchor="middle" font-size="14" fill="var(--ink-soft, #545c78)" font-family="Zen Maru Gothic, sans-serif" font-weight="700">受けとる人によって</text>
<text x="194" y="396" text-anchor="middle" font-size="14" fill="var(--ink-soft, #545c78)" font-family="Zen Maru Gothic, sans-serif" font-weight="700">できあがりがバラバラに</text>
<path d="M374 240 h40" stroke="var(--ink-soft, #545c78)" stroke-width="3"/><path d="M406 230 l10 10 l-10 10" fill="none" stroke="var(--ink-soft, #545c78)" stroke-width="3"/>
<rect x="428" y="66" width="348" height="350" rx="14" fill="var(--surface, #fff)" stroke="var(--sun, #f2b01e)" stroke-width="3"/>
<text x="602" y="97" text-anchor="middle" font-size="17" fill="var(--ink, #1d2540)" font-family="Zen Maru Gothic, sans-serif" font-weight="700">🏁 ゴールテープつきの頼み方</text>
<rect x="448" y="114" width="308" height="84" rx="12" fill="var(--sun-soft, #fdf0cc)" stroke="var(--sun, #f2b01e)" stroke-width="2.5"/><text x="466" y="139" font-size="15" fill="#c0583a" font-family="Zen Maru Gothic, sans-serif" font-weight="700">🎯 できあがりの姿</text><text x="466" y="162" font-size="14" fill="var(--ink, #1d2540)" font-family="Zen Maru Gothic, sans-serif" font-weight="700">焼きたてパン24種類が、</text><text x="466" y="184" font-size="14" fill="var(--ink, #1d2540)" font-family="Zen Maru Gothic, sans-serif" font-weight="700">値札つきで棚にならんでいる</text><rect x="448" y="208" width="308" height="62" rx="12" fill="var(--sun-soft, #fdf0cc)" stroke="var(--sun, #f2b01e)" stroke-width="2.5"/><text x="466" y="233" font-size="15" fill="#c0583a" font-family="Zen Maru Gothic, sans-serif" font-weight="700">⏰ しめきり</text><text x="466" y="256" font-size="14" fill="var(--ink, #1d2540)" font-family="Zen Maru Gothic, sans-serif" font-weight="700">毎日 朝7時30分（開店30分前）</text><rect x="448" y="280" width="308" height="62" rx="12" fill="var(--sun-soft, #fdf0cc)" stroke="var(--sun, #f2b01e)" stroke-width="2.5"/><text x="466" y="305" font-size="15" fill="#c0583a" font-family="Zen Maru Gothic, sans-serif" font-weight="700">🔍 確かめるもの</text><text x="466" y="328" font-size="14" fill="var(--ink, #1d2540)" font-family="Zen Maru Gothic, sans-serif" font-weight="700">棚の写真と開店準備チェック表</text>
<rect x="448" y="354" width="308" height="44" rx="12" fill="var(--leaf-soft, #dcf1e8)" stroke="var(--leaf, #2f8f6b)" stroke-width="2"/>
<text x="602" y="382" text-anchor="middle" font-size="14" fill="var(--ink, #1d2540)" font-family="Zen Maru Gothic, sans-serif" font-weight="700">🙌 やり方（ならべる順番など）は任せる</text>
</g></svg>