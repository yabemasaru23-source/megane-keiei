<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img" aria-label="上司と部下の距離の3つの形。左の「近すぎ・バラバラ」は、上司が2人の部下とだけとても近く、ほかの3人とは遠い。近い人だけがとくべつで、えこひいきに見える。まんなかの「遠すぎ」は、上司が5人全員と遠く、相談や報告が届かず、がんばりも見えない。右の「ちょうどいい」は、上司が5人全員と同じ距離で、あいさつ・ありがとう・面談がだれにも同じに届く">
