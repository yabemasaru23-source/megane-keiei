ace, #fff)" stroke="var(--ink, #1d2540)" stroke-width="2"/><text x="474.0" y="310" text-anchor="middle" font-size="15" fill="var(--ink, #1d2540)" font-family="Zen Maru Gothic, sans-serif" font-weight="700">30日目</text><text x="474.0" y="330" text-anchor="middle" font-size="13" fill="var(--ink, #1d2540)" font-family="Zen Maru Gothic, sans-serif" font-weight="700">15分の面談</text><rect x="170" y="414" width="180" height="50" rx="12" fill="var(--leaf-soft, #dcf1e8)" stroke="var(--ink, #1d2540)" stroke-width="2"/><text x="260.0" y="435" text-anchor="middle" font-size="15" fill="#1d2540" font-family="Zen Maru Gothic, sans-serif" font-weight="700">45日目</text><text x="260.0" y="455" text-anchor="middle" font-size="13" fill="#1d2540" font-family="Zen Maru Gothic, sans-serif" font-weight="700">中間のふり返り</text><rect x="4" y="289" width="110" height="50" rx="12" fill="var(--surface, #fff)" stroke="var(--ink, #1d2540)" stroke-width="2"/><text x="59.0" y="310" text-anchor="middle" font-size="15" fill="var(--ink, #1d2540)" font-family="Zen Maru Gothic, sans-serif" font-weight="700">60日目</text><text x="59.0" y="330" text-anchor="middle" font-size="13" fill="var(--ink, #1d2540)" font-family="Zen Maru Gothic, sans-serif" font-weight="700">15分の面談</text><text x="260" y="239" text-anchor="middle" font-size="20" fill="var(--ink, #1d2540)" font-family="Zen Maru Gothic, sans-serif" font-weight="700">📋 成長シート</text><text x="260" y="267" text-anchor="middle" font-size="15" fill="var(--ink-soft, #545c78)" font-family="Zen Maru Gothic, sans-serif" font-weight="700">90日で1段のぼる</text><text x="16" y="150" font-size="14" fill="var(--ink-soft, #545c78)" font-family="Zen Maru Gothic, sans-serif" font-weight="700">90日目が</text><text x="16" y="170" font-size="14" fill="var(--ink-soft, #545c78)" font-family="Zen Maru Gothic, sans-serif" font-weight="700">次の1日目に</text>
