>気合いを入れよう！</text><path d="M30 112 l-6 -6 M30 126 h-8 M200 96 l6 -8" stroke="var(--warm, #c0583a)" stroke-width="2.5"/><path d="M378 132 l6 -6 M378 146 h8" stroke="var(--warm, #c0583a)" stroke-width="2.5"/><circle cx="95" cy="308" r="15" fill="#f3c9a0" stroke="var(--ink, #1d2540)" stroke-width="2"/><circle cx="90" cy="306" r="2" fill="#1d2540"/><circle cx="100" cy="306" r="2" fill="#1d2540"/><path d="M90 314 q5 4 10 0" fill="none" stroke="#1d2540" stroke-width="1.5"/><text x="95" y="342" text-anchor="middle" font-size="13" fill="var(--ink-soft, #545c78)" font-family="Zen Maru Gothic, sans-serif" font-weight="700">店長</text><circle cx="205" cy="308" r="15" fill="#f3c9a0" stroke="var(--ink, #1d2540)" stroke-width="2"/><circle cx="200" cy="306" r="2" fill="#1d2540"/><circle cx="210" cy="306" r="2" fill="#1d2540"/><path d="M200 314 q5 4 10 0" fill="none" stroke="#1d2540" stroke-width="1.5"/><text x="205" y="342" text-anchor="middle" font-size="13" fill="var(--ink-soft, #545c78)" font-family="Zen Maru Gothic, sans-serif" font-weight="700">社長</text><circle cx="315" cy="308" r="15" fill="#f3c9a0" stroke="var(--ink, #1d2540)" stroke-width="2"/><circle cx="310" cy="306" r="2" fill="#1d2540"/><circle cx="320" cy="306" r="2" fill="#1d2540"/><path d="M310 314 q5 4 10 0" fill="none" stroke="#1d2540" stroke-width="1.5"/><text x="315" y="342" text-anchor="middle" font-size="13" fill="var(--ink-soft, #545c78)" font-family="Zen Maru Gothic, sans-serif" font-weight="700">店長</text><rect x="40" y="356" width="330" height="32" rx="16" fill="var(--sun-soft, #fdf0cc)"/><text x="205" y="378" text-anchor="middle" font-size="15" fill="var(--ink, #1d2540)" font-family="Zen Maru Gothic, sans-serif" font-weight="700">60分話して、何も決まらない</text>
<rect x="410" y="20" width="370" height="380" rx="16" fill="var(--surface, #fff)" stroke="var(--leaf, #2f8f6b)" stroke-width="3"/><text x="595.0" y="54" text-anchor="middle" font-size="18" fill="var(--leaf, #2f8f6b)" font-family="Zen Maru Gothic, sans-serif" font-weight="700">事実から始める会議</text><text x="595.0" y="78" text-anchor="middle" font-size="13" fill="var(--ink-soft, #545c78)" font-family="Zen Maru Gothic, sans-serif" font-weight="700">まず事実、それから気持ち</text><rect x="428" y="94" width="334" height="94" rx="12" fill="var(--leaf-soft, #dcf1e8)"/><text x="444" y="118" text-anchor="start" font-size="15" fill="var(--ink, #1d2540)" font-family="Zen Maru Gothic, sans-serif" font-weight="700">① 事実をそろえる</text><text x="746" y="118" text-anchor="end" font-size="13" fill="var(--ink-soft, #545c78)" font-family="Zen Maru Gothic, sans-serif" font-weight="700">📏 数字・日付</text><rect x="444" y="128" width="302" height="50" rx="6" fill="var(--surface, #fff)"/><line x1="444" y1="153" x2="746" y2="153" stroke="var(--ink-soft, #545c78)" stroke-width="1.5"/><text x="456" y="146" text-anchor="start" font-size="12" fill="var(--ink, #1d2540)" font-family="Zen Maru Gothic, sans-serif" font-weight="700">来店数（1日平均）</text><text x="734" y="146" text-anchor="end" font-size="12" fill="var(--ink, #1d2540)" font-family="Zen Maru Gothic, sans-serif" font-weight="700">181人 → 176人</text><text x="456" y="171" text-anchor="start" font-size="12" fill="var(--ink, #1d2540)" font-family="Zen Maru Gothic, sans-serif" font-weight="700">17時以降の来店</text><text x="734" y="171" text-anchor="end" font-size="12" fill="var(--warm, #c0583a)" font-family="Zen Maru Gothic, sans-serif" font-weight="700">31人 → 19人</text><path d="M595.0 192 v14 M588.0 199 l7 7 l7 -7" fill="none" stroke="var(--ink-soft, #545c78)" stroke-width="3"/><rect x="428" y="212" width="334" height="56" rx="12" fill="var(--sun-soft, #fdf0cc)"/><text x="444" y="236" text-anchor="start" font-size="15" fill="var(--ink, #1d2540)" font-family="Zen Maru Gothic, sans-serif" font-weight="700">② 気持ち・意見を出す</text><text x="444" y="257" text-anchor="start" font-size="12" fill="var(--ink, #1d2540)" font-family="Zen Maru Gothic, sans-serif" font-weight="700">「私は〜と思う。もとにした事実は〜」</text><path d="M595.0 272 v14 M588.0 279 l7 7 l7 -7" fill="none" stroke="var(--ink-soft, #545c78)" stroke-width="3"/><rect x="428" y="292" width="334" height="56" rx="12" fill="var(--sky, #dbe7fb)"/><text x="444" y="316" text-anchor="start" font-size="15" fill="var(--ink, #1d2540)" font-family="Zen Maru Gothic, sans-serif" font-weight="700">③ 決める</text><text x="444" y="337" text-anchor="start" font-size="12" fill="var(--ink, #1d2540)" font-family="Zen Maru Gothic, sans-serif" font-weight="700">一つ上の席の人が、事実をもとに</text><rect x="430" y="356" width="330" height="32" rx="16" fill="var(--leaf-soft, #dcf1e8)"/><text x="595.0" y="378" text-anchor="middle" font-size="15" fill="var(--ink, #1d2540)" font-family="Zen Maru Gothic, sans-serif" font-weight="700">時間内に「次にやること」が決まる</text>
</g>
