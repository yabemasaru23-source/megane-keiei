<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" role="img" aria-label="左は熱さで決まる会議。店長が「お客さん、減ってる気がする！」「みんな、がんばってます！」、社長が「気合いを入れよう！」と気持ちの言葉をぶつけ合い、60分話しても何も決まらない。右は事実から始める会議。①まず来店数などの数字で事実をそろえる（来店数は181人から176人でほぼ同じ、17時以降は31人から19人に減った）、②「私はこう思う。もとにした事実はこれ」と気持ち・意見を出す、③一つ上の席の人が事実をもとに決める。時間内に次にやることが決まる">
<rect width="800" height="420" rx="18" fill="var(--sky, #dbe7fb)"/>
<g stroke-linecap="round" stroke-linejoin="round">
